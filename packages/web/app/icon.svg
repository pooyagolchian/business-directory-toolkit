<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Directory from Scratch">
  <!-- Monochrome by design (ADR 0004): the mark is typographic, not a logo.
       Drawn as paths rather than a <text> element so it renders identically
       everywhere — favicon rendering cannot be relied on to have any font. -->
  <rect width="64" height="64" fill="#000" />
  <!-- Serif "D": stem, bowl, and the two bracketed serifs. -->
  <path fill="#fff" d="M14 16h20c10.5 0 17 6.2 17 16s-6.5 16-17 16H14v-4h4V20h-4v-4Zm12 4v24h6.5c7.2 0 11.5-4.4 11.5-12s-4.3-12-11.5-12H26Z" />
</svg>
