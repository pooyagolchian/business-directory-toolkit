name: Deploy

# Manual only, and only from main.
#
# Deploys are not run on every push on purpose: this stack creates billable AWS
# resources and a public site, and an accidental deploy from a feature branch
# is not a mistake worth leaving available.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "SST stage to deploy"
        required: true
        default: "dev"
        type: choice
        options: [dev, production]

concurrency:
  # Two deploys to one stage will fight over SST state and can leave it locked.
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  # `id-token: write` is what makes OIDC work — it lets the job mint a
  # short-lived token AWS will trust. Without it the action cannot assume a
  # role, and the only alternative is long-lived access keys in secrets.
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    steps:
      # Pinned to commit SHAs rather than tags — see the note in ci.yml. It
      # matters more here than there: this job holds an OIDC token that can
      # assume a role in the AWS account, so a hijacked action tag would be
      # running with deploy credentials rather than against fixtures.
      # Fail before anything billable happens, and say exactly what is missing.
      # An unset variable expands to an empty string, so without this the OIDC
      # step fails with "Could not assume role" and the dataset step fails with
      # a bare aws-cli error — neither of which names the actual cause.
      - name: Check deploy configuration
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          DATASET: ${{ vars.DATASET_S3_URI }}
        run: |
          missing=0
          if [ -z "$ROLE" ]; then
            echo "::error::Repository variable AWS_DEPLOY_ROLE_ARN is not set."
            echo "  Create an IAM role whose trust policy allows ONLY this repo:"
            echo "    token.actions.githubusercontent.com:sub ="
            echo "      repo:${{ github.repository }}:ref:refs/heads/main"
            echo "  then: gh variable set AWS_DEPLOY_ROLE_ARN --body <role-arn>"
            missing=1
          fi
          if [ -z "$DATASET" ]; then
            echo "::error::Repository variable DATASET_S3_URI is not set."
            echo "  data/out/ is git-ignored (ADR 0002) but required at build"
            echo "  time (ADR 0009), so the dataset travels through private S3."
            echo "  See docs/adr/0015-ship-the-dataset-to-ci-through-private-s3.md"
            missing=1
          fi
          exit $missing

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Never deploy something that does not build and pass.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # No AWS credentials are stored anywhere. The job proves its identity to
      # AWS with a GitHub-signed token, and AWS hands back credentials that
      # expire in an hour. A leaked workflow log is therefore not a leaked key.
      #
      # SETUP (once, per AWS account):
      #   1. Create an IAM OIDC provider for token.actions.githubusercontent.com
      #   2. Create a role whose trust policy allows only this repository, and
      #      ideally only this ref:
      #        "token.actions.githubusercontent.com:sub":
      #          "repo:pooyagolchian/business-directory-toolkit:ref:refs/heads/main"
      #   3. Put the role ARN in the repository variable AWS_DEPLOY_ROLE_ARN
      #
      # Scoping `sub` to the repo matters: without it, any repository on GitHub
      # could assume the role.
      # TEMPORARY: prints only the `sub` claim of the OIDC token so the IAM
      # trust policy can be scoped to the real value instead of a guess. The
      # subject is not a secret — it is the string AWS matches on — and the
      # token itself is never printed. Remove once the trust policy is pinned.
      - name: Show OIDC subject
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "sub = $(echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq -r '.sub')"
          echo "aud = $(echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq -r '.aud')"

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: deploy-${{ inputs.stage }}-${{ github.run_id }}

      # The crawl output is never committed (ADR 0002) but is bundled into the
      # server function at build time (ADR 0009), so a fresh checkout has the
      # requirement and not the file. Fetched here, with the same short-lived
      # credentials the deploy uses, and verified before the build can consume
      # it — `pnpm build` would otherwise exit 1 deep inside `sst deploy`.
      - name: Fetch the dataset
        env:
          DATASET_S3_URI: ${{ vars.DATASET_S3_URI }}
        run: pnpm dataset:pull

      - name: Deploy
        run: npx sst deploy --stage ${{ inputs.stage }}
