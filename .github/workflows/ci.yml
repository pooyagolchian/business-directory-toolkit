name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No AWS and no SearchApi credentials are exposed to this workflow.
# The test suite runs entirely against recorded fixtures, so CI never
# spends API credits — including on pull requests from forks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is a mutable
      # pointer: whoever controls the action's repository can move `v4` onto
      # new code, and every workflow that trusts the tag runs it on the next
      # push. That is not hypothetical — it is how the tj-actions compromise
      # reached thousands of repositories. A SHA cannot be re-pointed.
      #
      # The trailing comment is what Dependabot reads to offer upgrades, so
      # keep it in step with the SHA above it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check

      - name: Assert no secrets committed
        run: |
          if git ls-files | grep -qxF '.env'; then
            echo "::error::.env is tracked by git. Remove it and rotate the key."
            exit 1
          fi
          echo "OK: .env is not tracked"

      - name: Assert no dataset committed
        run: |
          # See docs/adr/0002-do-not-redistribute-the-dataset.md
          if git ls-files | grep -qE '^data/(raw|out)/'; then
            echo "::error::Crawled data must not be committed."
            exit 1
          fi
          echo "OK: no crawled data tracked"
