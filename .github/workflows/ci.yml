name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# No AWS and no SearchApi credentials are exposed to this workflow.
# The test suite runs entirely against recorded fixtures, so CI never
# spends API credits — including on pull requests from forks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is a mutable
      # pointer: whoever controls the action's repository can move `v4` onto
      # new code, and every workflow that trusts the tag runs it on the next
      # push. That is not hypothetical — it is how the tj-actions compromise
      # reached thousands of repositories. A SHA cannot be re-pointed.
      #
      # The trailing comment is what Dependabot reads to offer upgrades, so
      # keep it in step with the SHA above it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # `.nvmrc` holds an EXACT version, not the `24` it used to hold, and that
      # is the whole point of this step. setup-node resolves node-version-file
      # as a semver RANGE against the runner's toolcache, so a floating `24`
      # meant the Node this suite runs on changed whenever the runner image
      # rebuilt — no commit, no diff, nothing in git to explain it.
      #
      # That is not hypothetical. Node 24.20.0 stopped validating punycode
      # labels in the URL parser, which silently disarmed the IDNA guard in
      # packages/core/src/website.ts. The SAME repository SHA was green on
      # 24.19.0 and red on 24.20.0, four days apart, and the only way to find
      # out which Node a run used was to read the log. See PR #20.
      #
      # Measured on 2026-09-12, and the reason this is pinned rather than left
      # alone: ubuntu-24.04's toolcache carried 22.23.2 and 24.20.0, so `24`
      # resolved HERE to 24.20.0 while the same `.nvmrc` resolved on a
      # maintainer's machine to 24.21.0. CI was testing a different Node from
      # the one the code was written on, and nothing said so.
      #
      # The cost is a download-and-extract on any runner whose toolcache does
      # not yet carry the pinned version — seconds, on a job that already runs
      # typecheck, lint, test and a format check, and it disappears once the
      # image catches up. The dependency cache is unaffected: setup-node keys it
      # on OS, arch, package manager and the lockfile hash, never the Node
      # version.
      #
      # Bumping this is a one-line pull request against .nvmrc. There is no bot
      # for it on purpose — Dependabot has no ecosystem that updates a language
      # runtime (dependabot-core#14752 is open and unbuilt), and a workflow that
      # opened the PR itself would need "Allow GitHub Actions to create and
      # approve pull requests" turned on, then land its own `verify` run in an
      # approval-required state. A required check that a maintainer routinely
      # bypasses is worse than no automation at all.
      #
      # `engines.node` in package.json stays `>=24` deliberately. That is a
      # promise to whoever installs these packages, and it holds — the suite is
      # green on 24.13.0, 24.20.0 and 24.21.0. This pin says which single
      # version gets tested, not which ones are supported.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check

      - name: Assert no secrets committed
        run: |
          if git ls-files | grep -qxF '.env'; then
            echo "::error::.env is tracked by git. Remove it and rotate the key."
            exit 1
          fi
          echo "OK: .env is not tracked"

      - name: Assert no dataset committed
        run: |
          # See docs/adr/0002-do-not-redistribute-the-dataset.md
          if git ls-files | grep -qE '^data/(raw|out)/'; then
            echo "::error::Crawled data must not be committed."
            exit 1
          fi
          echo "OK: no crawled data tracked"
